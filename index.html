<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura (Hardened)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            cursor: none;
        }
        canvas {
            display: block;
        }
        /* VULN-005 Mitigation: Graceful Degradation Message */
        #unsupported-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- VULN-005 Mitigation: Container for failure message -->
<div id="unsupported-message">
    <p>This experience requires a modern browser<br>with WebGL and Web Audio support.</p>
</div>

<script type="module">
    import('./assets/app.js').catch(error => {
        document.getElementById('unsupported-message').style.display = 'block';
        console.error('Unable to start Aura:', error);
    });
</script>
</body>
</html>
